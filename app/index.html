<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InterviewCoach – HR Interview Tips Chatbot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef5ff; --panel:#ffffff; --ink:#0f2a55; --muted:#5f7396; --line:#d3e2f8;
  --brand:#1f6feb; --brand-ink:#ffffff; --user:#1f6feb; --user-ink:#ffffff;
  --bot:#f1f7ff; --mark:#1f6feb;
  --head:'Bricolage Grotesque',system-ui,sans-serif; --body:'Source Sans 3',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
.app{display:grid;grid-template-columns:300px 1fr;height:100%;max-width:1180px;margin:0 auto;gap:20px;padding:20px}
aside,main{background:var(--panel);border:1px solid var(--line);border-radius:14px;min-height:0}
aside{padding:22px;display:flex;flex-direction:column;gap:18px;overflow:auto}
h1{font-family:var(--head);font-size:1.6rem;line-height:1.1;margin:0}
aside p{margin:0;color:var(--muted);font-size:.95rem}
.topics{display:flex;flex-direction:column;gap:8px}
.topics h2{font-family:var(--head);font-size:.95rem;margin:4px 0 2px;color:var(--muted);font-weight:500}
.topic{all:unset;box-sizing:border-box;cursor:pointer;padding:10px 12px;border:1px solid var(--line);
  border-radius:10px;font-size:.98rem;border-left:4px solid var(--brand)}
.topic:hover{background:var(--bot)}
.topic:focus-visible,button:focus-visible,textarea:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.note{margin-top:auto;font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
main{display:flex;flex-direction:column;overflow:hidden}
header{padding:16px 22px;background:linear-gradient(180deg,#f7faff,#fff);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
header strong{font-family:var(--head);font-size:1.1rem}
.status{font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;background:#2ca86b}
.dot.demo{background:#f2b134}
#log{flex:1;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:min(640px,88%);padding:12px 16px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
.msg.bot{background:var(--bot);border-bottom-left-radius:4px;align-self:flex-start}
.msg.user{background:var(--user);color:var(--user-ink);border-bottom-right-radius:4px;align-self:flex-end}
.msg.bot b{font-weight:600}
.src{display:block;margin-top:8px;font-size:.8rem;color:var(--muted)}
.typing{display:inline-flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
form{display:flex;gap:10px;padding:14px 18px;border-top:1px solid var(--line)}
textarea{flex:1;resize:none;font:inherit;color:var(--ink);background:var(--bot);border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;max-height:120px}
#send{font:inherit;font-weight:600;background:var(--brand);color:var(--brand-ink);border:0;border-radius:10px;padding:0 20px;cursor:pointer}
#send:disabled{opacity:.5;cursor:default}
#clear{font:inherit;background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:4px 10px;cursor:pointer}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr;padding:10px;gap:10px}
  aside{padding:14px;flex-direction:column}
  .topics{flex-direction:row;flex-wrap:wrap}
  aside p,.note{display:none}
}
@media (prefers-reduced-motion:reduce){.typing i{animation:none}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div>
      <h1>InterviewCoach</h1>
      <p>Ask for HR interview tips: preparing, answering, and following up.</p>
    </div>
    <div class="topics" id="topics">
      <h2>Start with a topic</h2>
      <button class="topic" type="button">How do I prepare for a job interview?</button>
      <button class="topic" type="button">How do I answer “Tell me about yourself”?</button>
      <button class="topic" type="button">What is the STAR method?</button>
      <button class="topic" type="button">What should I wear to an interview?</button>
      <button class="topic" type="button">How do I answer “What is your weakness?”</button>
      <button class="topic" type="button">What questions should I ask the interviewer?</button>
      <button class="topic" type="button">How do I follow up after an interview?</button>
    </div>
    <div class="note">Tips are general guidance only. Each company hires differently, so check the job advert and ask the recruiter when unsure.</div>
  </aside>

  <main>
    <header>
      <strong>Interview tips chat</strong>
      <span class="status"><span class="dot" id="dot"></span><span id="statusText">Connecting…</span>
        <button id="clear" type="button">New chat</button></span>
    </header>
    <div id="log" role="log" aria-live="polite"></div>
    <form id="form">
      <textarea id="input" rows="1" placeholder="Type your interview question…" aria-label="Your question" required></textarea>
      <button id="send" type="submit">Send</button>
    </form>
  </main>
</div>

<script>
const API_URL = "/api/chat";
const WELCOME = "Hi! I'm InterviewCoach. Ask me how to prepare, answer common HR questions, or follow up after an interview. Pick a topic on the left or type your own question.";

const DEMO = [
  {k:["prepare","preparation"], a:"Research the company, re-read the job advert, and match your skills to it. Prepare 3 stories from your experience and practise answering out loud. Plan your route and arrive 10–15 minutes early."},
  {k:["star"], a:"STAR keeps answers structured:\nSituation – set the scene.\nTask – your responsibility.\nAction – what you did.\nResult – the outcome, with numbers if possible."},
  {k:["wear","dress"], a:"Dress one step above the company's everyday dress code. Neat, clean and comfortable business attire is a safe choice."},
  {k:["yourself"], a:"Use a short present–past–future format: your current role or studies, relevant experience, and why this job is your next step. Aim for about one minute."}
];
const FALLBACK = "I can only help with interview tips. Try asking about preparation, common questions, the STAR method, dress code, or follow-up emails.";

const log = document.getElementById("log"), form = document.getElementById("form"),
      input = document.getElementById("input"), send = document.getElementById("send"),
      dot = document.getElementById("dot"), statusText = document.getElementById("statusText");
let history = [];

function add(role, text, source){
  const d = document.createElement("div");
  d.className = "msg " + role;
  d.textContent = text;
  if (source){ const s = document.createElement("span"); s.className = "src"; s.textContent = "Based on: " + source; d.appendChild(s); }
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}
function setStatus(demo){
  dot.className = "dot" + (demo ? " demo" : "");
  statusText.textContent = demo ? "Demo mode (no backend)" : "Connected";
}
function demoAnswer(q){
  q = q.toLowerCase();
  const hit = DEMO.find(x => x.k.some(w => q.includes(w)));
  return {answer: hit ? hit.a : FALLBACK};
}
async function ask(q){
  const typing = add("bot", "");
  typing.innerHTML = '<span class="typing" aria-label="Typing"><i></i><i></i><i></i></span>';
  send.disabled = true;
  let data;
  try{
    const r = await fetch(API_URL, {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({message:q, history})});
    if(!r.ok) throw new Error(r.status);
    data = await r.json(); setStatus(false);
  }catch(e){ data = demoAnswer(q); setStatus(true); }
  typing.remove();
  add("bot", data.answer, data.source);
  history.push({role:"user",content:q},{role:"assistant",content:data.answer});
  history = history.slice(-10);
  send.disabled = false; input.focus();
}
form.addEventListener("submit", e => {
  e.preventDefault();
  const q = input.value.trim(); if(!q) return;
  add("user", q); input.value = ""; input.style.height = "auto"; ask(q);
});
input.addEventListener("keydown", e => { if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); form.requestSubmit(); }});
input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = input.scrollHeight + "px"; });
document.getElementById("topics").addEventListener("click", e => {
  if(e.target.classList.contains("topic")){ input.value = e.target.textContent; form.requestSubmit(); }
});
document.getElementById("clear").addEventListener("click", () => { log.innerHTML = ""; history = []; add("bot", WELCOME); });
add("bot", WELCOME);
fetch(API_URL, {method:"OPTIONS"}).then(()=>setStatus(false)).catch(()=>setStatus(true));
</script>
</body>
</html>
