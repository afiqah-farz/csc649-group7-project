<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InterviewCoach – HR Interview Tips Chatbot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef5ff; --panel:#ffffff; --ink:#0f2a55; --muted:#5f7396; --line:#d3e2f8;
  --brand:#1f6feb; --brand-ink:#ffffff; --user:#1f6feb; --user-ink:#ffffff;
  --bot:#f1f7ff; --mark:#1f6feb;
  --head:'Bricolage Grotesque',system-ui,sans-serif; --body:'Source Sans 3',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
.app{display:grid;grid-template-columns:300px 1fr;height:100%;max-width:1180px;margin:0 auto;gap:20px;padding:20px}
aside,main{background:var(--panel);border:1px solid var(--line);border-radius:14px;min-height:0}
aside{padding:22px;display:flex;flex-direction:column;gap:18px;overflow:auto}
h1{font-family:var(--head);font-size:1.6rem;line-height:1.1;margin:0}
aside p{margin:0;color:var(--muted);font-size:.95rem}
.topics{display:flex;flex-direction:column;gap:8px}
.topics h2{font-family:var(--head);font-size:.95rem;margin:4px 0 2px;color:var(--muted);font-weight:500}
.topic{all:unset;box-sizing:border-box;cursor:pointer;padding:10px 12px;border:1px solid var(--line);
  border-radius:10px;font-size:.98rem;border-left:4px solid var(--brand)}
.topic:hover{background:var(--bot)}
.topic:focus-visible,button:focus-visible,textarea:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.note{margin-top:auto;font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
main{display:flex;flex-direction:column;overflow:hidden}
header{padding:16px 22px;background:linear-gradient(180deg,#f7faff,#fff);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
header strong{font-family:var(--head);font-size:1.1rem}
.status{font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;background:#2ca86b}
.dot.demo{background:#f2b134}
#log{flex:1;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:min(640px,88%);padding:12px 16px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
.msg.bot{background:var(--bot);border-bottom-left-radius:4px;align-self:flex-start}
.msg.user{background:var(--user);color:var(--user-ink);border-bottom-right-radius:4px;align-self:flex-end}
.msg.bot b{font-weight:600}
.src{display:block;margin-top:8px;font-size:.8rem;color:var(--muted)}
.typing{display:inline-flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
form{display:flex;gap:10px;padding:14px 18px;border-top:1px solid var(--line)}
textarea{flex:1;resize:none;font:inherit;color:var(--ink);background:var(--bot);border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;max-height:120px}
#send{font:inherit;font-weight:600;background:var(--brand);color:var(--brand-ink);border:0;border-radius:10px;padding:0 20px;cursor:pointer}
#send:disabled{opacity:.5;cursor:default}
#clear{font:inherit;background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:4px 10px;cursor:pointer}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr;padding:10px;gap:10px}
  aside{padding:14px;flex-direction:column}
  .topics{flex-direction:row;flex-wrap:wrap}
  aside p,.note{display:none}
}
@media (prefers-reduced-motion:reduce){.typing i{animation:none}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div>
      <h1>InterviewCoach</h1>
      <p>Ask about IT interview questions and how to answer them well.</p>
    </div>
    <div class="topics" id="topics">
      <h2>Start with a topic</h2>
      <button class="topic" type="button">How do you deal with deadlines?</button>
      <button class="topic" type="button">What is your troubleshooting process?</button>
      <button class="topic" type="button">Why did you decide to go into IT?</button>
      <button class="topic" type="button">How do you stay up to date with new technology?</button>
      <button class="topic" type="button">Tell me about a time you could not solve a problem. What did you do?</button>
      <button class="topic" type="button">How would you explain a technical concept to someone without technical knowledge?</button>
      <button class="topic" type="button">How would you make sure a computer network is secure?</button>
    </div>
    <div class="note">Tips are general guidance only. Each company hires differently, so check the job advert and ask the recruiter when unsure.</div>
  </aside>

  <main>
    <header>
      <strong>Interview tips chat</strong>
      <span class="status"><span class="dot" id="dot"></span><span id="statusText">Loading…</span>
        <button id="clear" type="button">New chat</button></span>
    </header>
    <div id="log" role="log" aria-live="polite"></div>
    <form id="form">
      <textarea id="input" rows="1" placeholder="Type your interview question…" aria-label="Your question" required></textarea>
      <button id="send" type="submit">Send</button>
    </form>
  </main>
</div>

<script>

const DATA = [{"q": "Tell me about a recent project you are proud of and your role in it.", "a": "Choose a project where you can clearly explain your own part, such as a final year project, an internship task or a personal app. Describe the problem, the technologies you used, what you personally did, and the result. Personal projects outside class are a big plus because they show passion for IT."}, {"q": "Tell me about a time you could not solve a problem. What did you do?", "a": "Be honest about the situation and what blocked you. Then explain your next steps, such as searching documentation, asking a senior or teammate, or escalating the issue properly. Interviewers want to see that you stay calm, find help, and learn from it."}, {"q": "How do you deal with deadlines?", "a": "Explain how you plan your work, for example by breaking a project into small tasks with their own dates and checking your progress often. Give an example of a tight deadline you met. If a deadline was ever missed, explain how you informed the team early and what you changed afterwards."}, {"q": "What preparations do you do before starting a project?", "a": "Explain your steps, such as understanding the requirements, asking questions, researching suitable tools, planning tasks and setting up version control like Git. Mention whether you plan alone or with the team. This shows you are organised and do not just jump straight into coding."}, {"q": "Why did you decide to go into IT?", "a": "Explain what genuinely attracts you to IT, such as solving problems, building things with code, or always learning something new. Give a short real example, like the first program or website you made. Then link that interest to why you want this particular role."}, {"q": "How do you stay up to date with new technology?", "a": "Mention the real ways you keep learning, such as online courses, tech blogs, YouTube channels, newsletters, podcasts or tech communities. Give one recent thing you learned. This shows you are curious and will keep improving."}, {"q": "What would you do if you were in charge of the whole organisation’s technology?", "a": "Show that you can think beyond your own tasks. Share a simple vision, such as improving security, moving systems to the cloud or automating manual work, and explain how you would plan it step by step. This shows leadership potential and a growth mindset."}, {"q": "What do you think is the most pressing problem in tech today and how would you fix it?", "a": "Pick one issue you understand well, such as cybersecurity threats, data privacy or the misuse of AI. Explain why it matters to people and businesses, then suggest a clear and realistic solution. This shows big-picture thinking and problem-solving skills."}, {"q": "What is your troubleshooting process?", "a": "Use clear steps: first identify the problem and ask questions, then find the cause, test a possible fix, confirm the problem is solved, and finally document what happened. Give a simple example, such as fixing a user’s internet connection."}, {"q": "What is an IP address?", "a": "An IP address is a unique number given to every device on a network, such as a laptop or phone, like a home address for computers. It lets devices find and send data to each other over the internet or a local network. An IPv4 address looks like 192.168.1.10."}, {"q": "Are you currently working on any personal projects?", "a": "Talk about a project you built in your own time, such as a website, mobile app, game or small tool, and share the GitHub link if you have one. Explain what it does, the technologies you used, and what you learned from it. Employers like personal projects because they show you enjoy coding outside of work or class."}, {"q": "How would you explain a technical concept to someone without technical knowledge?", "a": "Avoid jargon and use simple everyday comparisons, such as describing DNS as the internet’s phone book. Check that the person understands by asking questions, and use pictures, diagrams or mock-ups if they help. Give an example, such as explaining your project to a lecturer or helping a family member with their phone."}, {"q": "What is a CPU?", "a": "The CPU, or Central Processing Unit, is the main chip that processes instructions in a computer, often called its brain. It runs programs by doing calculations and controlling other parts. Its speed and number of cores affect how fast a computer can work."}, {"q": "How would you move a file using the command line?", "a": "On Windows Command Prompt, use the move command, for example: move report.txt D:\\backup. On Linux or macOS, use the mv command, for example: mv report.txt /home/user/backup/. If you are unsure in an interview, explain how you would check the help or documentation."}, {"q": "How familiar are you with different operating systems?", "a": "Check the job description to see which systems they use, such as Windows, Linux or macOS. Be honest about which ones you have used and for what, such as Linux for servers or Windows for user support. Show that you are willing to learn any system you know less about."}, {"q": "How would you make sure a computer network is secure?", "a": "Mention key tools such as firewalls, secure router settings, VPNs and antivirus software. Add good habits like strong passwords, multi-factor authentication, regular software updates and backups. If you have any real security experience, share it as an example."}, {"q": "What software or technologies do you use now, which have you learned before, and how did you learn them?", "a": "Be honest about the tools you know, such as Python, Java, SQL, Git or a cloud platform, and say where you learned them, for example in university courses, online courses or your own projects. Mention any certifications or training you have done. Most importantly, show that you can learn and apply new tools quickly."}, {"q": "How does your IT work fit into your company’s overall goals?", "a": "Show that you understand IT supports the whole company, not just your own tasks. Give an example, such as a system you built that saves another department time or keeps customer data safe. Explain that you work with other departments to understand what they need, so your work supports the company’s goals."}];
const WELCOME = "Hi! I'm InterviewCoach. Ask me about IT interview questions and how to answer them well. Pick a topic on the left or type your own question.";
const FALLBACK = "I can only help with interview tips. Try asking about deadlines, troubleshooting, handling problems, personal projects or basic IT questions.";
const MIN_SCORE = 0.35;
const STOP = new Set("a an the and or of to in on for with is are was were be been do does did you your i me my we what how why when which who would could should can will about tell if it its this that as at by from into than then so not no any have has had today now".split(" "));

function tokens(t){
  return (t.toLowerCase().match(/[a-z0-9]+/g) || [])
    .filter(w => w.length > 1 && !STOP.has(w))
    .map(w => (w.length > 3 && w.endsWith("s") && !w.endsWith("ss")) ? w.slice(0,-1) : w);
}
const docs = DATA.map(d => tokens(d.q + " " + d.q + " " + d.a));
const df = {};
docs.forEach(d => new Set(d).forEach(w => df[w] = (df[w]||0) + 1));
const idf = {};
Object.keys(df).forEach(w => idf[w] = Math.log((1 + docs.length) / (1 + df[w])) + 1);
function vec(toks){
  const tf = {}; toks.forEach(w => tf[w] = (tf[w]||0) + 1);
  const v = {}; let n = 0;
  for (const w in tf){ if (idf[w]){ v[w] = tf[w] * idf[w]; n += v[w]*v[w]; } }
  n = Math.sqrt(n) || 1;
  for (const w in v) v[w] /= n;
  return v;
}
const vecs = docs.map(vec);
function search(query){
  const qv = vec(tokens(query));
  let best = {score:0, i:-1};
  vecs.forEach((dv, i) => {
    let s = 0; for (const w in qv) if (dv[w]) s += qv[w]*dv[w];
    if (s > best.score) best = {score:s, i};
  });
  return best;
}

async function callLLM(question, retrieved){ return null; }

async function getAnswer(q){
  const hit = search(q);
  if (hit.i < 0 || hit.score < MIN_SCORE) return {answer: FALLBACK};
  const row = DATA[hit.i];
  let text = null;
  try { text = await callLLM(q, row); } catch(e){}
  return {answer: text || row.a, source: row.q};
}

/* ---------- Interface ---------- */
const log = document.getElementById("log"), form = document.getElementById("form"),
      input = document.getElementById("input"), send = document.getElementById("send"),
      dot = document.getElementById("dot"), statusText = document.getElementById("statusText");
dot.className = "dot"; statusText.textContent = "Ready · " + DATA.length + " Q&A loaded";

function add(role, text, source){
  const d = document.createElement("div");
  d.className = "msg " + role; d.textContent = text;
  if (source){ const s = document.createElement("span"); s.className = "src"; s.textContent = "Based on: " + source; d.appendChild(s); }
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}
async function ask(q){
  const typing = add("bot", "");
  typing.innerHTML = '<span class="typing" aria-label="Typing"><i></i><i></i><i></i></span>';
  send.disabled = true;
  await new Promise(r => setTimeout(r, 400));
  const data = await getAnswer(q);
  typing.remove(); add("bot", data.answer, data.source);
  send.disabled = false; input.focus();
}
form.addEventListener("submit", e => {
  e.preventDefault();
  const q = input.value.trim(); if(!q) return;
  add("user", q); input.value = ""; input.style.height = "auto"; ask(q);
});
input.addEventListener("keydown", e => { if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); form.requestSubmit(); }});
input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = input.scrollHeight + "px"; });
document.getElementById("topics").addEventListener("click", e => {
  if(e.target.classList.contains("topic")){ input.value = e.target.textContent; form.requestSubmit(); }
});
document.getElementById("clear").addEventListener("click", () => { log.innerHTML = ""; add("bot", WELCOME); });
add("bot", WELCOME);
</script>
</body>
</html>
